<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/index :: cabeceraHtml}"/>
    <body>
        <header th:replace="~{general/index :: encabezado}"/>
        <nav th:replace="~{general/index :: barraNavegacion}"/>

        <section class="container my-4">
            <h2 class="titulo-seccion mb-3"
                th:text="${servicio.id == null} ? 'Agregar servicio' : 'Editar servicio'">Formulario</h2>

            <form th:action="@{/servicios/guardar}" th:object="${servicio}" method="post" class="card tarjeta-vet p-4">
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}" id="nombre" maxlength="100" required/>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="precio">Precio</label>
                        <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}" id="precio" required/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="duracionMinutos">Duración (minutos)</label>
                        <input type="number" min="1" class="form-control" th:field="*{duracionMinutos}" id="duracionMinutos" required/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="tipoServicio">Tipo de servicio</label>
                    <select class="form-select" th:field="*{tipoServicio.id}" id="tipoServicio" required>
                        <option value="">-- Seleccione un tipo --</option>
                        <option th:each="tipo : ${listaTipos}" th:value="${tipo.id}">[[${tipo.nombre}]]</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn btn-vet">Guardar</button>
                    <a th:href="@{/servicios}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </section>

        <footer th:replace="~{general/index :: piePagina}"/>
    </body>
</html>
