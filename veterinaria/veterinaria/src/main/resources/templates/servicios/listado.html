<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/index :: cabeceraHtml}"/>
    <body>
        <header th:replace="~{general/index :: encabezado}"/>
        <nav th:replace="~{general/index :: barraNavegacion}"/>

        <section class="container my-4">
            <div th:replace="~{general/index :: avisoResultado}"/>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="titulo-seccion">Servicios Veterinarios</h2>
                <a th:href="@{/servicios/nuevo}" class="btn btn-vet"><i class="fas fa-plus"></i> Agregar servicio</a>
            </div>

            <table class="table table-hover tabla-vet bg-white shadow-sm">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Precio</th>
                        <th>Duración</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="servicio : ${listaServicios}">
                        <td>[[${servicio.nombre}]]</td>
                        <td>[[${servicio.tipoServicio.nombre}]]</td>
                        <td th:text="${'₡' + #numbers.formatDecimal(servicio.precio, 1, 'COMMA', 2, 'POINT')}">Precio</td>
                        <td>[[${servicio.duracionMinutos}]] min</td>
                        <td class="text-center">
                            <a th:href="@{/servicios/editar/{id}(id=${servicio.id})}" class="btn btn-sm btn-acento">Editar</a>
                            <button type="button" class="btn btn-sm btn-danger"
                                    data-bs-toggle="modal" data-bs-target="#modalEliminar"
                                    th:data-id="${servicio.id}" th:data-nombre="${servicio.nombre}">Eliminar</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaServicios)}">
                        <td colspan="5" class="text-center text-muted">No hay servicios registrados</td>
                    </tr>
                </tbody>
            </table>

            <div class="modal fade" id="modalEliminar" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <form th:action="@{/servicios/eliminar}" method="post">
                            <div class="modal-header">
                                <h5 class="modal-title">Confirmar eliminación</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                ¿Seguro que desea eliminar el servicio <strong id="nombreAEliminar"></strong>?
                                <input type="hidden" name="id" id="idAEliminar"/>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-danger">Eliminar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{general/index :: piePagina}"/>

        <script>
            document.getElementById('modalEliminar').addEventListener('show.bs.modal', function (evento) {
                const boton = evento.relatedTarget;
                document.getElementById('idAEliminar').value = boton.getAttribute('data-id');
                document.getElementById('nombreAEliminar').textContent = boton.getAttribute('data-nombre');
            });
        </script>
    </body>
</html>
